name: Send Morning Brief

# Sends the daily morning brief (markets + world + business + tech, from
# email_digest.json) to a WhatsApp group. Replaces the earlier Responder
# email-newsletter plan — see README ("רב מסר" V1 messaging is being
# retired, V2.0 has no send endpoint) — with the WhatsApp group the account
# already uses for the main bot.

on:
  schedule:
    # 08:34 Israel time (UTC+3 DST / UTC+2 winter) → 05:34 UTC.
    # NOTE: when Israel exits DST (~late Oct), this lands at 09:34 local
    # until adjusted back to '34 6 * * *' — same drift as email-digest-pool.yml.
    # Runs ~2.5h after Email Digest Pool's 06:00 Israel-time run, so
    # email_digest.json is fresh by the time this fires.
    - cron: '34 5 * * *'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

  # External backup trigger (cron-job.org) that pings this workflow on its
  # own schedule, independent of GitHub's own `schedule` trigger. GitHub's
  # `schedule` is best-effort and can silently drop firings under load (see
  # market-news.yml's 2026-09-14 incident) — this workflow only had the one
  # daily firing, with no redundancy, so a single dropped firing meant no
  # message went out all day (happened 2026-09-15). send_morning_brief.py's
  # "already sent today" gate (morning_brief_log.json) makes it safe for
  # both the schedule and this backup to fire the same morning — only the
  # first one actually sends. Point the external cron at a time shortly
  # after 08:34 Israel time.
  repository_dispatch:
    types: [morning-brief-trigger]

concurrency:
  group: send-morning-brief
  cancel-in-progress: false

jobs:
  send-morning-brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send morning brief
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN:    ${{ secrets.GREEN_API_TOKEN }}
          MORNING_BRIEF_TO:   ${{ secrets.MORNING_BRIEF_TO }}
        run: python send_morning_brief.py --auto --provider green

      - name: Commit morning_brief_log.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add morning_brief_log.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update morning_brief_log.json [skip ci]"
            git push
          fi
