name: Market News Bot

on:
  schedule:
    # Fire every 15 min, 08:00-21:30 Israel time (UTC+3 DST / UTC+2 winter),
    # Israeli workweek Sun-Fri (0=Sun ... 5=Fri).
    #
    # GitHub's `schedule` trigger is best-effort: under load it silently DROPS
    # scheduled firings rather than queueing them — this bit us on 2026-09-14,
    # when every firing between 08:00-09:30 IL was dropped and no message went
    # out all morning. Firing every 15 min (instead of every 90) means a
    # dropped firing just gets picked up ~15 min later by the next one instead
    # of leaving a multi-hour gap. main.py's own MIN_SEND_INTERVAL_MINUTES gate
    # (85 min) is what actually paces sends, so the extra firings only add
    # redundancy, not extra messages.
    #
    # NOTE: when Israel exits DST (~late Oct), 08:00-21:30 local becomes
    # 05:00-18:30 UTC → adjust the hour range below to 05-18.
    - cron: '*/15 5-18 * * 0-5'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Prevent overlapping runs
concurrency:
  group: market-news
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market news bot
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN:    ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_TO:        ${{ secrets.WHATSAPP_TO }}
          X_BEARER_TOKEN:     ${{ secrets.X_BEARER_TOKEN }}
        run: python main.py --auto

      - name: Commit updated state files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_log.json
          for f in twitter_last_id.json twitter_unused.json pending_articles.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update state files [skip ci]"
            git push
          fi
