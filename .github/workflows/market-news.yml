name: Market News Bot

on:
  schedule:
    # 10 runs/day, every 1.5h, 08:00–21:30 Israel time (UTC+3 DST / UTC+2 winter).
    # Days: 0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri  (Israeli workweek Sun–Fri)
    # Split into two cron lines (:00 and :30 UTC) since a single cron entry
    # can't mix minutes — together they land on Israel :00/:30 marks.
    #   08:00, 09:30, 11:00, 12:30, 14:00, 15:30, 17:00, 18:30, 20:00, 21:30
    #
    # GitHub's `schedule` trigger is best-effort: under load it silently DROPS
    # scheduled firings rather than queueing them, so exact timing isn't
    # guaranteed even with this spacing. main.py still enforces the actual
    # minimum gap between sent WhatsApp messages (MIN_SEND_INTERVAL_MINUTES),
    # so a late/duplicate firing never sends more often than that.
    #
    # NOTE: when Israel exits DST (~late Oct), these UTC times land 1h
    # earlier in local time (07:00–20:30) until the cron is adjusted back.
    - cron: '0 5,8,11,14,17 * * 0-5'
    - cron: '30 6,9,12,15,18 * * 0-5'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Prevent overlapping runs
concurrency:
  group: market-news
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market news bot
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN:    ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_TO:        ${{ secrets.WHATSAPP_TO }}
          X_BEARER_TOKEN:     ${{ secrets.X_BEARER_TOKEN }}
        run: python main.py --auto

      - name: Commit updated state files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_log.json
          for f in twitter_last_id.json twitter_unused.json pending_articles.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update state files [skip ci]"
            git push
          fi
